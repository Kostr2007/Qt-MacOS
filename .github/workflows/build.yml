name: Build and test
on: [push, pull_request]
jobs:
  gallery:
    strategy:
      fail-fast: false
      matrix:
        # Qt 6.8.2 links AGL, which was removed from the macOS 26 SDK.
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - name: Select the SDK supported by Qt 6.8.2
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          cache: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Configure standalone consumer
        run: cmake -S examples/minimal -B build-example -DCMAKE_BUILD_TYPE=Release
      - name: Build standalone consumer
        run: cmake --build build-example --config Release --parallel 4
