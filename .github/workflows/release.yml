name: Release source archive
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Package the tagged source and checksum
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          version="${RELEASE_TAG#v}"
          assets_dir="$RUNNER_TEMP/qtmacos-release"
          mkdir -p "$assets_dir"
          git archive --format=tar.gz --prefix="Qt-MacOS-$version/" HEAD \
            -o "$assets_dir/Qt-MacOS-$version-source.tar.gz"
          cd "$assets_dir"
          sha256sum "Qt-MacOS-$version-source.tar.gz" > SHA256SUMS.txt
      - name: Attach source to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/qtmacos-release/Qt-MacOS-$version-source.tar.gz" \
            "$RUNNER_TEMP/qtmacos-release/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY"
